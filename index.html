<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Locater App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; background-color: #fdf2f8; }
        #map { height: 350px; width: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="text-gray-800 p-4 max-w-md mx-auto pb-10">
    <!-- App Header -->
    <div class="flex items-center justify-between mb-4 bg-white p-3 rounded-2xl shadow-sm">
        <h1 class="font-bold text-lg text-pink-600">📍 Live Locater App</h1>
        <span id="username" class="text-sm bg-pink-100 text-pink-700 px-2 py-1 rounded-full">User</span>
    </div>

    <!-- Proximity Alert Box -->
    <div id="alertBox" class="hidden mb-4 bg-red-100 border-2 border-red-400 text-red-700 p-3 rounded-2xl shadow-md text-sm font-bold animate-pulse">
        🚨 <span id="alertMessage">သတိပေးချက်</span>
    </div>

    <!-- 1. LARGE MAP SECTION -->
    <div id="mapSection" class="bg-white p-4 rounded-2xl shadow-md mb-4 border border-pink-100">
        <h2 class="font-bold text-md mb-2 flex items-center gap-2">🗺️ Live Interactive Map</h2>

        <div class="mb-3 border border-pink-200 overflow-hidden shadow-inner">
            <div id="map"></div>
        </div>

        <!-- Custom Places -->
        <div class="mb-3">
            <div class="flex gap-2">
                <input type="text" id="placeNameInput" placeholder="နေရာအမည် (ဥပမာ - Home, Work)" class="flex-1 border border-pink-200 p-2 rounded-xl text-xs outline-none focus:border-pink-500">
                <button onclick="saveCustomPlace()" class="bg-pink-600 text-white px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap">📌 နေရာမှတ်မည်</button>
            </div>
            <div id="savedPlacesList" class="flex gap-2 overflow-x-auto mt-2 text-xs"></div>
        </div>

        <div class="bg-pink-50 p-3 rounded-xl mb-3 text-sm">
            <p id="status" class="text-pink-800 font-medium">Status: မစတင်ရသေးပါ</p>
            <p id="coords" class="text-xs text-gray-500 mt-1">Lat: -, Lon: -</p>
            <p id="etaText" class="text-xs font-bold text-pink-700 mt-1 hidden"></p>
        </div>

        <!-- Time-limited Sharing Timer -->
        <div class="flex items-center justify-between mb-3 bg-gray-50 p-2 rounded-xl text-xs">
            <span class="text-gray-600 font-bold">⏱️ မျှဝေမည့် အချိန်သတ်မှတ်ရန်</span>
            <select id="shareDuration" class="bg-white border border-gray-300 rounded-lg p-1">
                <option value="1">၁ နာရီ (1 hr)</option>
                <option value="2">၂ နာရီ (2 hrs)</option>
                <option value="5">၅ နာရီ (5 hrs)</option>
            </select>
        </div>

        <button onclick="toggleLocationSharing()" id="shareBtn" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-medium py-2.5 rounded-xl transition duration-200">
            Location စတင်မျှဝေမည်
        </button>
    </div>

    <!-- 2. NAVIGATION & ROUTE -->
    <div class="bg-white p-4 rounded-2xl shadow-md mb-4 border border-pink-100">
        <h2 class="font-bold text-md mb-2 text-pink-600">🧭 Navigation & Route</h2>
        <div class="space-y-2">
            <input type="text" id="destinationInput" placeholder="သွားလိုသည့် နေရာ သို့မဟုတ် Lat, Lon" class="w-full border border-pink-200 p-2 rounded-xl text-xs outline-none focus:border-pink-500">
            <button onclick="calculateInAppRoute()" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-xl text-xs font-bold transition">
                🗺️ လက်ရှိနေရာမှ လမ်းကြောင်းဆွဲမည်
            </button>
        </div>
    </div>

    <!-- 3. ACTIVE USERS LIST SECTION -->
    <div class="bg-white p-4 rounded-2xl shadow-md mb-4 border border-pink-100">
        <h2 class="font-bold text-md mb-2 text-pink-600">👥 Active Sharers List</h2>
        <div id="userList" class="space-y-2 max-h-40 overflow-y-auto">
            <p class="text-xs text-gray-400 text-center py-2">Location ဖွင့်ထားသူများ ရှာဖွေနေသည်...</p>
        </div>
    </div>

    <!-- 4. BUBBLE SORTING GAME SECTION -->
    <div class="bg-white p-4 rounded-2xl shadow-md border border-pink-200">
        <div class="flex justify-between items-center mb-2">
            <h2 class="font-bold text-md text-pink-600">🤎 Bubble Sorting</h2>
            <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded-full">Mini Game</span>
        </div>
        <p class="text-xs text-gray-500 mb-4">ချစ်စရာ အရုပ်လေးများ အရွယ်အစားအလိုက် တန်းစီကြမယ်!</p>

        <div id="bubbleContainer" class="flex justify-center items-center gap-2 mb-4 h-24 bg-pink-50 rounded-xl p-2 overflow-x-auto"></div>

        <div class="flex gap-2">
            <button onclick="startBubbleSort()" id="sortBtn" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-medium py-2 rounded-xl transition">
                Start Sorting
            </button>
            <button onclick="resetGame()" id="resetBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 rounded-xl transition">
                Reset
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let tg = window.Telegram?.WebApp;
        let telegramFullName = "User";

        if (tg) {
            tg.expand();
            let firstName = tg.initDataUnsafe?.user?.first_name || "Guest";
            let lastName = tg.initDataUnsafe?.user?.last_name || "";
            telegramFullName = `${firstName} ${lastName}`.trim();
            document.getElementById('username').innerText = telegramFullName;
        }

        const GAS_URL = "https://script.google.com/macros/s/AKfycbzWHt4YFHxbOzxlZ2f_Wfr8rb7ztbqLo6aBeHG74DLKUlLuZ3EhLHeqmojwR8Tb_jh0/exec";

        // Map setup
        let map = L.map('map').setView([16.8661, 96.1951], 13);
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Maps'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let routeLine = null;
        let myCurrentLat = null;
        let myCurrentLon = null;
        let savedPlaces = [];
        let hasVibrated = false;

        function saveCustomPlace() {
            let name = document.getElementById('placeNameInput').value.trim();
            if(!name) { alert("နေရာအမည် ရိုက်ထည့်ပါ"); return; }
            if(!myCurrentLat || !myCurrentLon) { alert("လက်ရှိတည်နေရာ မရသေးပါ။"); return; }

            savedPlaces.push({ name: name, lat: myCurrentLat, lon: myCurrentLon });
            document.getElementById('placeNameInput').value = '';
            renderSavedPlaces();
            L.marker([myCurrentLat, myCurrentLon]).addTo(map).bindPopup(`<b>📍 ${name}</b>`).openPopup();
        }

        function renderSavedPlaces() {
            let container = document.getElementById('savedPlacesList');
            container.innerHTML = '';
            savedPlaces.forEach(p => {
                container.innerHTML += `<button onclick="map.setView([${p.lat}, ${p.lon}], 16); map.invalidateSize();" class="bg-pink-100 text-pink-700 px-2 py-1 rounded-lg whitespace-nowrap font-bold">📌 ${p.name}</button>`;
            });
        }

        // --- In-App Navigation Route & ETA Calculator (Optimized for Yangon/Myanmar) ---
        function calculateInAppRoute() {
            let destText = document.getElementById('destinationInput').value.trim();
            if(!destText) { alert("သွားလိုသည့်နေရာကို ရိုက်ထည့်ပါ"); return; }
            if(!myCurrentLat || !myCurrentLon) { alert("လက်ရှိတည်နေရာကို ရယူနေပါသည်..."); return; }

            let targetLat, targetLon;
            let matched = savedPlaces.find(p => p.name.toLowerCase() === destText.toLowerCase());

            if (matched) {
                targetLat = matched.lat;
                targetLon = matched.lon;
                drawRouteAndETA(myCurrentLat, myCurrentLon, targetLat, targetLon);
            } else if (destText.includes(',')) {
                let parts = destText.split(',');
                targetLat = parseFloat(parts[0]);
                targetLon = parseFloat(parts[1]);
                if (!isNaN(targetLat) && !isNaN(targetLon)) {
                    drawRouteAndETA(myCurrentLat, myCurrentLon, targetLat, targetLon);
                } else { alert("Lat, Lon ပုံစံ မှားယွင်းနေပါသည်။"); }
            } else {
                // Nominatim API ကို ရန်ကုန်မြို့/မြန်မာနိုင်ငံနယ်နိမိတ် (Viewbox & Boundingbox) အထူးပြု၍ ရှာဖွေစေခြင်း
                // Yangon bounds approximate: lon min/max: 96.0 - 96.3, lat min/max: 16.7 - 17.0 (Myanmar country-wide bounding box can also be used)
                let viewbox = "94.5,16.2,97.8,17.5"; // Yangon Region / Greater Yangon area viewbox (lon1,lat1,lon2,lat2)
                let searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destText)}&viewbox=${viewbox}&bounded=1`;

                fetch(searchUrl, {
                    headers: { 'User-Agent': 'LiveLocaterApp/1.0' }
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        targetLat = parseFloat(data[0].lat);
                        targetLon = parseFloat(data[0].lon);
                        drawRouteAndETA(myCurrentLat, myCurrentLon, targetLat, targetLon);
                    } else {
                        // အကယ်၍ အထက်ပါ Area ထဲ မတွေ့ပါက တစ်နိုင်ငံလုံးအတိုင်းအတာဖြင့် ထပ်မံရှာဖွေပေးခြင်း
                        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destText + ', Myanmar')}`, {
                            headers: { 'User-Agent': 'LiveLocaterApp/1.0' }
                        })
                        .then(res => res.json())
                        .then(fallbackData => {
                            if (fallbackData && fallbackData.length > 0) {
                                targetLat = parseFloat(fallbackData[0].lat);
                                targetLon = parseFloat(fallbackData[0].lon);
                                drawRouteAndETA(myCurrentLat, myCurrentLon, targetLat, targetLon);
                            } else {
                                alert("ထိုနေရာကို မရှာတွေ့ပါ၊ Lat, Lon တိုက်ရိုက် ရိုက်ထည့်ပေးပါ သို့မဟုတ် Saved Place သုံးပါ");
                            }
                        })
                        .catch(() => alert("နေရာရှာဖွေရာတွင် အဆင်မပြေပါ"));
                    }
                })
                .catch(() => alert("နေရာရှာဖွေရာတွင် အဆင်မပြေပါ"));
            }
        }

        function drawRouteAndETA(lat1, lon1, lat2, lon2) {
            document.getElementById('mapSection').scrollIntoView({ behavior: 'smooth' });
            setTimeout(() => { map.invalidateSize(); }, 300);

            if (routeLine) { map.removeLayer(routeLine); }

            fetch(`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`)
                .then(res => res.json())
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        let route = data.routes[0];
                        let coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                        routeLine = L.polyline(coords, { color: '#db2777', weight: 5, opacity: 0.8 }).addTo(map);
                        map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

                        let durationMinutes = Math.round(route.duration / 60);
                        let arrivalTime = new Date(Date.now() + route.duration * 1000);
                        let timeString = arrivalTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        let etaDisplay = document.getElementById('etaText');
                        etaDisplay.innerText = `⏱️ ခန့်မှန်းကြာချိန် - ${durationMinutes} မိနစ် (ရောက်ရှိမည့်အချိန် - ${timeString})`;
                        etaDisplay.classList.remove('hidden');
                    }
                })
                .catch(() => {
                    routeLine = L.polyline([[lat1, lon1], [lat2, lon2]], { color: '#db2777', weight: 4, dashArray: '5, 10' }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
                });
        }

        function fetchAllLocations() {
            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => {
                    markersLayer.clearLayers();
                    let listHTML = '';
                    let alertTriggered = false;
                    let alertUserName = "";
                    let myUserId = tg?.initDataUnsafe?.user?.id?.toString() || "123456";

                    data.forEach(loc => {
                        if (loc.latitude && loc.longitude) {
                            let marker = L.marker([loc.latitude, loc.longitude]).bindPopup(`<b>${loc.name || 'User'}</b>`);
                            markersLayer.addLayer(marker);

                            let distanceText = "";
                            if (myCurrentLat !== null && myCurrentLon !== null && loc.userId.toString() !== myUserId) {
                                let distFeet = calculateDistance(myCurrentLat, myCurrentLon, loc.latitude, loc.longitude);
                                if (distFeet < 500) { 
                                    alertTriggered = true; 
                                    alertUserName = loc.name;
                                }
                                distanceText = `<span class="text-xs text-pink-600 font-bold">(${distFeet.toFixed(0)} ft away)</span>`;
                            }

                            listHTML += `
                                <div class="flex items-center justify-between bg-pink-50 p-2.5 rounded-xl text-xs">
                                    <span class="font-bold text-gray-700">🐼 ${loc.name} ${distanceText}</span>
                                    <button onclick="drawLineToUser(${loc.latitude}, ${loc.longitude})" class="bg-pink-500 text-white px-2.5 py-1 rounded-lg">View</button>
                                </div>
                            `;
                        }
                    });

                    document.getElementById('userList').innerHTML = listHTML || '<p class="text-xs text-gray-400 text-center py-2">Active sharers မရှိသေးပါ။</p>';

                    let alertBox = document.getElementById('alertBox');
                    let alertMsg = document.getElementById('alertMessage');
                    if (alertTriggered) { 
                        alertMsg.innerText = `${alertUserName} နှင့် ပေ ၅၀၀ အတွင်း နီးစပ်နေပါပြီ`;
                        alertBox.classList.remove('hidden'); 

                        if (!hasVibrated && navigator.vibrate) {
                            navigator.vibrate(3000);
                            hasVibrated = true;
                        }
                    } else { 
                        alertBox.classList.add('hidden'); 
                        hasVibrated = false;
                    }
                })
                .catch(err => console.log("Error:", err));
        }

        function drawLineToUser(targetLat, targetLon) {
            document.getElementById('mapSection').scrollIntoView({ behavior: 'smooth' });
            setTimeout(() => { map.invalidateSize(); }, 300);

            if (myCurrentLat !== null && myCurrentLon !== null) {
                drawRouteAndETA(myCurrentLat, myCurrentLon, targetLat, targetLon);
            } else {
                map.setView([targetLat, targetLon], 16);
            }
        }

        // Active Sharers များကိုသာ အမြဲစောင့်ကြည့်ရန် (Location Sharing ကို ပိတ်ထားလျှင်တောင် သူများနေရာကို ကြည့်နိုင်ရန်)
        setInterval(fetchAllLocations, 10000);
        fetchAllLocations();

        let watchId = null;
        let lastLat = null;
        let lastLon = null;
        let shareTimer = null;

        // အရေးကြီးချက် - App စဖွင့်ချိန် (load လုပ်ချိန်) တွင် Location အလိုအလျောက် မပွင့်စေရန် localStorage စစ်ဆေးမှုကို ဖြုတ်ထားလိုက်ပါပြီ။
        // ခလုတ်နှိပ်မှသာ start ဖြစ်ပါမည်။

        function toggleLocationSharing() {
            if (watchId === null) {
                startWatchingLocation(true);
            } else {
                stopLocationSharing();
            }
        }

        function startWatchingLocation(isNewStart = true) {
            const btn = document.getElementById('shareBtn');
            if (navigator.geolocation) {
                document.getElementById('status').innerText = "Status: တည်နေရာကို ရှာဖွေနေပါပြီ...";
                btn.innerText = "Location ရပ်တန့်မည်";
                btn.classList.replace('bg-pink-500', 'bg-red-500');

                if (shareTimer) clearTimeout(shareTimer);

                if (isNewStart) {
                    let hours = parseInt(document.getElementById('shareDuration').value);
                    shareTimer = setTimeout(() => {
                        stopLocationSharing();
                        alert("သတ်မှတ်ထားသော အချိန်ပြည့်သွားပါပြီ။ Location မျှဝေမှုကို ရပ်တန့်လိုက်ပါပြီ။");
                    }, hours * 3600 * 1000);
                }

                watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
                    enableHighAccuracy: true,
                    maximumAge: 10000,
                    timeout: 10000
                });
            } else { alert("Geolocation is not supported."); }
        }

        function stopLocationSharing() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            if (shareTimer) clearTimeout(shareTimer);
            sendToGAS(lastLat || 16.8661, lastLon || 96.1951, "Stopped");

            watchId = null;
            const btn = document.getElementById('shareBtn');
            document.getElementById('status').innerText = "Status: ရပ်တန့်ထားသည်";
            btn.innerText = "Location စတင်မျှဝေမည်";
            btn.classList.replace('bg-red-500', 'bg-pink-500');
        }

        function handlePosition(position) {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            myCurrentLat = lat;
            myCurrentLon = lon;

            document.getElementById('coords').innerText = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;

            if (lastLat !== null && lastLon !== null) {
                let distanceInFeet = calculateDistance(lastLat, lastLon, lat, lon);
                if (distanceInFeet >= 100) {
                    sendToGAS(lat, lon, "Active");
                    lastLat = lat;
                    lastLon = lon;
                }
            } else if (lastLat === null) {
                sendToGAS(lat, lon, "Active");
                lastLat = lat;
                lastLon = lon;
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c * 5280;
        }

        function handleError(error) { 
            let errorMsg = "Status: Location ရယူ၍ မရပါ";
            if (error.code === error.PERMISSION_DENIED) {
                errorMsg = "Status: Location ခွင့်ပြုချက် ပိတ်ထားပါသည်";
            }
            document.getElementById('status').innerText = errorMsg; 
        }

        function sendToGAS(lat, lon, statusScore = "Active") {
            document.getElementById('status').innerText = statusScore === "Active" ? "Status: Google Sheet သို့ ပို့နေသည်..." : "Status: မျှဝေမှုကို ရပ်တန့်လိုက်ပါပြီ";
            let userId = tg?.initDataUnsafe?.user?.id || "123456";
            let userName = telegramFullName; 

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId: userId, name: userName, latitude: lat, longitude: lon, statusScore: statusScore })
            }).then(() => {
                if(statusScore === "Active") { document.getElementById('status').innerText = "Status: တည်နေရာ အပ်ဒိတ်လုပ်ပြီးပါပြီ ✅"; }
                fetchAllLocations();
            }).catch(() => { document.getElementById('status').innerText = "Status: ပို့ဆောင်မှု မအောင်မြင်ပါ ❌"; });
        }

        // --- BUBBLE SORTING GAME ---
        let characterArray = [
            { id: 1, size: 2, emoji: "🧸" },
            { id: 2, size: 5, emoji: "🐻" },
            { id: 3, size: 1, emoji: "🤎" },
            { id: 4, size: 8, emoji: "🐼" },
            { id: 5, size: 3, emoji: "🧸" }
        ];

        let isSorting = false;

        function renderBubbles() {
            const container = document.getElementById('bubbleContainer');
            if (!container) return;
            container.innerHTML = '';
            characterArray.forEach(item => {
                let div = document.createElement('div');
                div.className = "flex flex-col items-center justify-center w-14 h-16 bg-white border-2 border-pink-300 rounded-2xl shadow-sm transition-all duration-300";
                div.innerHTML = `<span class="text-3xl">${item.emoji}</span>`;
                container.appendChild(div);
            });
        }

        function resetGame() {
            if (isSorting) return;
            characterArray.sort(() => Math.random() - 0.5);
            renderBubbles();
        }

        async function startBubbleSort() {
            if (isSorting) return;
            isSorting = true;
            
            document.getElementById('sortBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('sortBtn').classList.add('opacity-50');
            document.getElementById('resetBtn').classList.add('opacity-50');

            let arr = [...characterArray];
            let len = arr.length;
            const container = document.getElementById('bubbleContainer');

            for (let i = 0; i < len; i++) {
                for (let j = 0; j < len - i - 1; j++) {
                    let nodes = container.children;
                    if (nodes[j] && nodes[j+1]) {
                        nodes[j].classList.add('bg-pink-200', 'scale-105', 'border-pink-500');
                        nodes[j+1].classList.add('bg-pink-200', 'scale-105', 'border-pink-500');
                    }

                    await new Promise(resolve => setTimeout(resolve, 400));

                    if (arr[j].size > arr[j + 1].size) {
                        let temp = arr[j];
                        arr[j] = arr[j + 1];
                        arr[j + 1] = temp;
                        characterArray = [...arr];
                        renderBubbles();
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }

                    if (nodes[j] && nodes[j+1]) {
                        nodes[j].classList.remove('bg-pink-200', 'scale-105', 'border-pink-500');
                        nodes[j+1].classList.remove('bg-pink-200', 'scale-105', 'border-pink-500');
                    }
                }
            }

            isSorting = false;
            document.getElementById('sortBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('sortBtn').classList.remove('opacity-50');
            document.getElementById('resetBtn').classList.remove('opacity-50');
        }

        renderBubbles();
    </script>
</body>
</html>
